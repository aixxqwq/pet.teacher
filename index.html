<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilim Buddy — учись вместе с питомцем</title>
  <meta name="description" content="Bilim Buddy — учёба с питомцем: ИИ-учитель, мини-подготовка к IELTS (Listening, Reading, Speaking, Writing с проверкой ИИ и образцами ответов), 560 школьных вопросов, карточки и фокус-таймер.">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <meta name="theme-color" content="#F3F0FF" id="themeColor">
  <script>
    /* Тема: выбор человека (☀/☾) или, если не выбирал, — как в настройках телефона/компьютера */
    (function () {
      var saved = null, m = window.matchMedia("(prefers-color-scheme: dark)");
      try { saved = localStorage.getItem("petTeacher.theme"); } catch (e) {}
      function apply() {
        var t = saved || (m.matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", t);
        var c = document.getElementById("themeColor");
        if (c) c.content = t === "dark" ? "#120E26" : "#F3F0FF";
      }
      apply();
      if (m.addEventListener) m.addEventListener("change", function () { if (!saved) apply(); });
      window.setTheme = function (t) { saved = t; try { localStorage.setItem("petTeacher.theme", t); } catch (e) {} apply(); };
      document.addEventListener("DOMContentLoaded", apply);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=22">
  <link rel="stylesheet" href="css/dark.css?v=22">
</head>
<body>

  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="topbar">
    <div class="wrap">
      <a class="logo" href="#/">

      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="home">Питомец</a>
        <a href="#/learn" data-route="learn">Учёба</a>
        <a href="#/cards" data-route="cards">Карточки <span class="nav-badge" id="dueBadge"></span></a>

        <a href="#/my" data-route="my">Мои вопросы</a>
      </nav>
      <div class="top-right">
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Сменить тему" title="Светлая / тёмная тема">
          <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="timer-chip" id="timerChip" href="#/focus"><i></i><span>25:00</span></a>
        <a class="timer-chip rest-chip" id="restChip" href="#/rest"><i></i><span></span></a>
        <a class="acc-chip" id="accChip" href="#/account">Войти</a>
        <a class="acc-chip reg" id="regChip" href="#/account">Регистрация</a>
        <a class="lvl-chip" id="lvlChip" href="#/"></a>
      </div>
    </div>
  </header>

  <main class="wrap" id="view"></main>

  <footer class="site-foot">

      <span>Прогресс хранится в браузере в формате JSON</span>
    </div>
  </footer>

    <a href="#/learn" data-route="learn"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/></svg><span>Учёба</span></a>

    <a href="#/ielts" data-route="ielts"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>IELTS</span></a>
    <a href="#/tutor" data-route="tutor"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Учитель</span></a>
    <a href="#/focus" data-route="focus"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>Фокус</span></a>

</html>
