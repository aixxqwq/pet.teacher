<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilim Buddy — учись вместе с питомцем</title>
  <meta name="description" content="Bilim Buddy — учёба с питомцем: ИИ-учитель, мини-подготовка к IELTS (Listening, Reading, Speaking, Writing с проверкой ИИ и образцами ответов), 560 школьных вопросов, карточки и фокус-таймер.">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg?v=2">
  <meta name="theme-color" content="#FBF4EC" id="themeColor">
  <script>
    /* Тема: выбор человека (☀/☾) или, если не выбирал, — как в настройках телефона/компьютера */
    (function () {
      var saved = null, m = window.matchMedia("(prefers-color-scheme: dark)");
      try { saved = localStorage.getItem("petTeacher.theme"); } catch (e) {}
      function apply() {
        var t = saved || (m.matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", t);
        var c = document.getElementById("themeColor");
        if (c) c.content = t === "dark" ? "#1C1820" : "#FBF4EC";
      }
      apply();
      if (m.addEventListener) m.addEventListener("change", function () { if (!saved) apply(); });
      window.setTheme = function (t) { saved = t; try { localStorage.setItem("petTeacher.theme", t); } catch (e) {} apply(); };
      document.addEventListener("DOMContentLoaded", apply);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=49">
  <link rel="stylesheet" href="css/dark.css?v=48">
  <link rel="stylesheet" href="css/soft.css?v=17">
  <link rel="stylesheet" href="css/playful.css?v=5">
</head>
<body>
  <!-- живой фон: размытые цветные пятна -->
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <!-- телефон: тонкая полоска сверху, меню выезжает слева -->
  <header class="mtop" id="mtop">
    <button class="mtop-btn" id="menuOpen" type="button" aria-label="Открыть меню">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <span class="mtop-title" id="mtopTitle">Bilim Buddy</span>
    <a class="mtop-pet" id="mtopPet" href="#/" aria-label="Питомец"></a>
  </header>
  <div class="side-dim" id="sideDim"></div>

  <!-- боковое меню -->
  <aside class="side" id="side">
    <div class="side-head">
      <a class="logo" href="#/">
        <img class="logo-mark" src="img/logo.svg?v=2" alt="" width="40" height="40">
        <span>Bilim Buddy</span>
      </a>
      <button class="side-toggle" id="sideToggle" type="button" aria-label="Свернуть меню" title="Свернуть меню">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="side-close" id="menuClose" type="button" aria-label="Закрыть меню">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav">
        <a href="#/" data-route="home" title="Питомец"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="16" rx="5" ry="4"/><circle cx="6" cy="10" r="1.8"/><circle cx="10" cy="6.5" r="1.8"/><circle cx="14" cy="6.5" r="1.8"/><circle cx="18" cy="10" r="1.8"/></svg><span class="lbl">Питомец</span></a>
        <a href="#/learn" data-route="learn" title="Учёба"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/></svg><span class="lbl">Учёба</span></a>
        <a href="#/cards" data-route="cards" title="Карточки"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/></svg><span class="lbl">Карточки</span> <span class="nav-badge" id="dueBadge"></span></a>
        <a href="#/ielts" data-route="ielts" title="IELTS"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span class="lbl">IELTS</span></a>
        <a href="#/tutor" data-route="tutor" title="ИИ-учитель"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span class="lbl">ИИ-учитель</span></a>
        <a href="#/focus" data-route="focus" title="Фокус"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span class="lbl">Фокус</span></a>
        <a href="#/my" data-route="my" title="Мои вопросы"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="lbl">Мои вопросы</span></a>
        <a href="#/class" data-route="class" title="Класс"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 20a6.5 6.5 0 0 0-3-5.5"/></svg><span class="lbl">Класс</span></a>
        <a href="#/shop" data-route="shop" title="Магазин"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="lbl">Магазин</span> <span class="coin-badge" id="coinBadge"></span></a>
    </nav>
    <div class="side-foot">
      <a class="timer-chip" id="timerChip" href="#/focus"><i></i><span>25:00</span></a>
      <a class="timer-chip rest-chip" id="restChip" href="#/rest"><i></i><span></span></a>
      <a class="lvl-chip" id="lvlChip" href="#/"></a>
      <div class="side-row">
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Сменить тему" title="Светлая / тёмная тема">
          <svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="theme-btn lang-btn" id="langBtn" type="button" data-noi18n title="Тілді ауыстыру / Сменить язык">ҚАЗ</button>
        <a class="acc-chip" id="accChip" href="#/account">Войти</a>
        <a class="acc-chip reg" id="regChip" href="#/account">Регистрация</a>
      </div>
    </div>
  </aside>

  <!-- компьютер: строка сверху — дата, напоминания, питомец -->
  <header class="dtop" id="dtop">
    <div class="dtop-date"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span id="dtopDate"></span></div>
    <div class="dtop-right">
      <a class="dtop-bell" href="#/cards" title="Карточки на повторение"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><i id="dtopBell"></i></a>
      <a class="dtop-who" href="#/" id="dtopWho"><span class="ava" id="dtopAva"></span><span><b id="dtopName"></b><small id="dtopSub"></small></span></a>
    </div>
  </header>

  <main class="wrap" id="view"></main>

  <footer class="site-foot">
    <div class="wrap">
      <span>Bilim Buddy — учись вместе с питомцем</span>
      <a href="#/privacy">Конфиденциальность</a>
    </div>
  </footer>


  <div class="toasts" id="toasts"></div>

  <!-- порядок важен: сначала питомцы и вопросы, потом логика, потом интерфейс -->

  <script src="js/questions.js?v=35"></script>
  <script src="js/game.js?v=35"></script>
  <script src="js/cards.js?v=35"></script>
  <script src="js/ielts.js?v=35"></script>
  <script src="js/ielts-lr.js?v=35"></script>
  <script src="js/ielts-audio.js?v=35"></script>
  <script src="js/ielts-models.js?v=35"></script>
  <script src="js/timer.js?v=35"></script>
  <script src="js/api.js?v=49"></script>
  <script src="js/i18n.js?v=51"></script>
  <script src="js/app.js?v=52"></script>
</body>
</html>
