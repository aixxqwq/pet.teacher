<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilim Buddy — учись вместе с питомцем</title>
  <meta name="description" content="Питомец-учитель: отвечай на вопросы, корми питомца знаниями и занимайся с фокус-таймером.">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <!-- живой фон: размытые цветные пятна -->
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="topbar">
    <div class="wrap">
      <a class="logo" href="#/">
        <img class="logo-mark" src="img/logo.svg" alt="" width="44" height="44">
        <span>Bilim Buddy</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="home">Питомец</a>
        <a href="#/learn" data-route="learn">Учёба</a>
        <a href="#/cards" data-route="cards">Карточки <span class="nav-badge" id="dueBadge"></span></a>
        <a href="#/ielts" data-route="ielts">IELTS</a>
        <a href="#/tutor" data-route="tutor">ИИ-учитель</a>
        <a href="#/focus" data-route="focus">Фокус</a>
        <a href="#/my" data-route="my">Мои вопросы</a>
      </nav>
      <div class="top-right">
        <a class="timer-chip" id="timerChip" href="#/focus"><i></i><span>25:00</span></a>
        <a class="acc-chip" id="accChip" href="#/account">Войти</a>
        <a class="acc-chip reg" id="regChip" href="#/account">Регистрация</a>
        <a class="lvl-chip" id="lvlChip" href="#/"></a>
      </div>
    </div>
  </header>

  <main class="wrap" id="view"></main>

  <footer class="site-foot">
    <div class="wrap">
      <span>Bilim Buddy — учебный проект на HTML, CSS и JavaScript</span>
      <span>Прогресс хранится в браузере в формате JSON</span>
    </div>
  </footer>

  <!-- нижнее меню для телефона -->
  <nav class="tabbar" id="tabbar">
    <a href="#/" data-route="home"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="16" rx="5" ry="4"/><circle cx="6" cy="10" r="1.8"/><circle cx="10" cy="6.5" r="1.8"/><circle cx="14" cy="6.5" r="1.8"/><circle cx="18" cy="10" r="1.8"/></svg><span>Питомец</span></a>
    <a href="#/learn" data-route="learn"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/></svg><span>Учёба</span></a>
    <a href="#/cards" data-route="cards"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/></svg><span>Карточки</span><i class="tab-badge" id="tabDue"></i></a>
    <a href="#/ielts" data-route="ielts"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>IELTS</span></a>
    <a href="#/tutor" data-route="tutor"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Учитель</span></a>
    <a href="#/focus" data-route="focus"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>Фокус</span></a>
  </nav>

  <div class="toasts" id="toasts"></div>

  <!-- порядок важен: сначала питомцы и вопросы, потом логика, потом интерфейс -->
  <script src="js/pets.js?v=16"></script>
  <script src="js/questions.js?v=16"></script>
  <script src="js/game.js?v=16"></script>
  <script src="js/cards.js?v=16"></script>
  <script src="js/ielts.js?v=16"></script>
  <script src="js/timer.js?v=16"></script>
  <script src="js/api.js?v=16"></script>
  <script src="js/app.js?v=16"></script>

</html>
